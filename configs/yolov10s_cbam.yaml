# YOLOv10s + CBAM
# Backbone C2f modules (layers 2, 4, 6) replaced with C2fCBAM.
# Neck C2f modules remain unchanged.

nc: 80
scales:
  s: [0.33, 0.50, 1024]  # depth_multiple, width_multiple, max_channels

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 3, C2fCBAM, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, C2fCBAM, [256, True]]          # 4
  - [-1, 1, SCDown, [512, 3, 2]]           # 5-P4/16
  - [-1, 6, C2fCBAM, [512, True]]          # 6
  - [-1, 1, SCDown, [1024, 3, 2]]          # 7-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 1, PSA, [1024]]                   # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                    # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                    # 16
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                    # 19
  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [1024, True, True]]    # 22
  - [[16, 19, 22], 1, v10Detect, [nc]]
